name: Build and Deploy Game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get the game
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marioadventureofthestarsv3/package-lock.json

      - name: Install game
        run: npm ci
        working-directory: marioadventureofthestarsv3

      - name: Build game
        run: npm run build -- --base=/marioclaudev3/
        working-directory: marioadventureofthestarsv3

      - name: Upload game
        uses: actions/upload-pages-artifact@v3
        with:
          path: marioadventureofthestarsv3/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Put game online
        id: deployment
        uses: actions/deploy-pages@v4
